<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings - Tips Tracker</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="owner-shell">
  <div class="owner-sidebar" id="sidebar"></div>

  <div class="owner-main">
    <div class="owner-main-header">
      <h1>Settings</h1>
      <div class="branch-info">
        <div class="branch-name" id="branch-tag"></div>
        <span class="badge" id="role-badge-pill"></span>
      </div>
    </div>

    <div class="card" style="max-width:480px; margin-bottom:20px">
      <h2>Change staff password</h2>
      <p class="subtitle">This is the password staff at this branch use to log in.</p>
      <form id="staff-pw-form">
        <label for="new-staff-password">New staff password</label>
        <input type="password" id="new-staff-password" minlength="6" required />
        <button type="submit" class="btn-primary" style="margin-top:14px">Update password</button>
        <div class="error-msg" id="staff-error"></div>
        <div class="success-msg" id="staff-success"></div>
      </form>
    </div>

    <div class="card" style="max-width:480px; margin-bottom:20px">
      <h2>Change admin password</h2>
      <p class="subtitle">Confirm the current admin password for this branch to set a new one.</p>
      <form id="admin-pw-form">
        <label for="current-password">Current admin password</label>
        <input type="password" id="current-password" required />
        <label for="new-admin-password">New admin password</label>
        <input type="password" id="new-admin-password" minlength="6" required />
        <button type="submit" class="btn-primary" style="margin-top:14px">Update admin password</button>
        <div class="error-msg" id="admin-error"></div>
        <div class="success-msg" id="admin-success"></div>
      </form>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
  (async () => {
    const session = await requireSession("admin");
    if (!session) return;
    renderBranchSidebar(session, "/settings.html");
  })();

  document.getElementById("staff-pw-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("staff-error");
    const successEl = document.getElementById("staff-success");
    errorEl.textContent = "";
    successEl.textContent = "";
    try {
      await api("/api/settings/staff-password", {
        method: "POST",
        body: JSON.stringify({ newPassword: document.getElementById("new-staff-password").value }),
      });
      successEl.textContent = "Staff password updated.";
      e.target.reset();
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });

  document.getElementById("admin-pw-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("admin-error");
    const successEl = document.getElementById("admin-success");
    errorEl.textContent = "";
    successEl.textContent = "";
    try {
      await api("/api/settings/admin-password", {
        method: "POST",
        body: JSON.stringify({
          currentPassword: document.getElementById("current-password").value,
          newPassword: document.getElementById("new-admin-password").value,
        }),
      });
      successEl.textContent = "Admin password updated.";
      e.target.reset();
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
