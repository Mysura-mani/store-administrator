<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delivery History - Tips Tracker</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="owner-shell">
  <div class="owner-sidebar" id="sidebar"></div>

  <div class="owner-main">
    <div class="owner-main-header">
      <h1>Delivery History</h1>
      <div class="branch-info">
        <div class="branch-name" id="branch-tag"></div>
        <span class="badge" id="role-badge-pill"></span>
      </div>
    </div>

    <div class="card">
    <div class="section-title">
      <h2>Pay by driver</h2>
      <div class="tabs" style="width:400px; margin:0">
        <button type="button" data-mode="day">Daily</button>
        <button type="button" data-mode="week" class="active">Weekly</button>
        <button type="button" data-mode="month">Monthly</button>
        <button type="button" data-mode="quarter">Quarterly</button>
      </div>
    </div>

    <div class="period-nav">
      <button class="btn-secondary" id="prev-btn">&larr; Prev</button>
      <div class="period-label" id="period-label">&nbsp;</div>
      <button class="btn-secondary" id="next-btn">Next &rarr;</button>
    </div>

    <div id="table-wrap"><p class="empty-state">Loading&hellip;</p></div>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
  let mode = "week";
  let anchor = todayStr();

  // Sums one zone's count or € value across a set of days — used both for a
  // driver's period-total row and for the grand-total footer.
  function sumZone(days, i, key) {
    return days.reduce((sum, d) => sum + (d[key][i] || 0), 0);
  }

  function zoneCellsHtml(zoneCounts, zoneValues) {
    return zoneCounts
      .map((c, i) => `<td>${formatMoney(zoneValues[i])}<br /><span class="hint">${c} order${c === 1 ? "" : "s"}</span></td>`)
      .join("");
  }

  function renderTable(history) {
    document.getElementById("period-label").textContent = history.label;
    const wrap = document.getElementById("table-wrap");

    if (history.rows.length === 0) {
      wrap.innerHTML = '<p class="empty-state">No entries in this period.</p>';
      return;
    }

    // Only the Daily view breaks delivery pay down by zone — a Weekly/
    // Monthly/Quarterly total spans several different zone mixes, where one
    // combined Delivery Pay figure reads more clearly than four summed ones.
    const zoneWise = mode === "day";

    const bodyRows = history.rows
      .map((row) => {
        const dayRows = row.days
          .map((d) => {
            const hintBits = [];
            if (!zoneWise) hintBits.push(`Z1:${d.zoneCounts[0]} Z2:${d.zoneCounts[1]} Z3:${d.zoneCounts[2]} Z4:${d.zoneCounts[3]}`);
            if (d.note) hintBits.push(escapeHtml(d.note));
            const dateHintHtml = hintBits.length ? `<br /><span class="hint">${hintBits.join(" — ")}</span>` : "";
            const payClass = d.isSolo ? (d.topUpApplied ? "pay-floor" : "pay-above") : "";
            const cashStr =
              d.cashOrderCount > 0 || d.cashOrderValue > 0 ? `${d.cashOrderCount} / ${formatMoney(d.cashOrderValue)}` : "—";
            // Only today's payout can be corrected (see requireTodayEntry on
            // the backend) — and only from the Daily view, never from an
            // expanded day inside Weekly/Monthly/Quarterly, so Edit never
            // shows up somewhere it would just 403 anyway.
            const canEdit = mode === "day" && d.date === todayStr();
            const editBtn = canEdit
              ? `<button class="btn-secondary btn-small edit-day-btn" data-id="${d.entryId}" data-driver="${row.driverId}">Edit</button>`
              : "";
            // In the zone-wise Daily view, "Pay" (base + orders, before tips)
            // gets its own column right after the zone breakdown, and the
            // minimum-wage-floor highlight moves there with it, since that's
            // the figure the floor actually affects — the final Actual Pay
            // column is just Pay + Tips, nothing floor-specific of its own.
            const deliveryCells = zoneWise
              ? zoneCellsHtml(d.zoneCounts, d.zoneValues) + `<td class="${payClass}">${formatMoney(d.pay)}</td>`
              : `<td>${formatMoney(d.deliveryPay)}</td>`;
            return `
              <tr class="day-subtable" data-owner="${row.driverId}" style="display:none">
                <td>${d.date}${dateHintHtml}</td>
                <td>${d.hours}h</td>
                <td>${formatMoney(d.basePay)}</td>
                ${deliveryCells}
                <td>${formatMoney(d.tips)}</td>
                <td class="${zoneWise ? "" : payClass}">${formatMoney(d.finalPay)}</td>
                <td>${cashStr}
                  ${editBtn}
                  <button class="btn-danger btn-small delete-day-btn" data-id="${d.entryId}">Delete</button>
                </td>
              </tr>
            `;
          })
          .join("");
        const cashTotalStr =
          row.cashOrderCount > 0 || row.cashOrderValue > 0
            ? `${row.cashOrderCount} / ${formatMoney(row.cashOrderValue)}`
            : "—";
        const rowDeliveryCells = zoneWise
          ? [0, 1, 2, 3]
              .map((i) => {
                const val = sumZone(row.days, i, "zoneValues");
                const cnt = sumZone(row.days, i, "zoneCounts");
                return `<td>${formatMoney(val)}<br /><span class="hint">${cnt} order${cnt === 1 ? "" : "s"}</span></td>`;
              })
              .join("") + `<td>${formatMoney(row.pay)}</td>`
          : `<td>${formatMoney(row.deliveryPay)}</td>`;
        return `
          <tr>
            <td><button class="expand-toggle" data-target="${row.driverId}">&#9656;</button> ${escapeHtml(row.name)}</td>
            <td>${row.hours}h</td>
            <td>${formatMoney(row.basePay)}</td>
            ${rowDeliveryCells}
            <td>${formatMoney(row.tips)}</td>
            <td>${formatMoney(row.finalPay)}</td>
            <td>${cashTotalStr}</td>
          </tr>
          ${dayRows}
        `;
      })
      .join("");

    const deliveryHeaders = zoneWise
      ? "<th>Zone 1</th><th>Zone 2</th><th>Zone 3</th><th>Zone 4</th><th>Pay</th>"
      : "<th>Delivery Pay</th>";
    const allDays = history.rows.flatMap((r) => r.days);
    const footerDeliveryCells = zoneWise
      ? [0, 1, 2, 3]
          .map((i) => {
            const val = sumZone(allDays, i, "zoneValues");
            const cnt = sumZone(allDays, i, "zoneCounts");
            return `<td>${formatMoney(val)}<br /><span class="hint">${cnt} order${cnt === 1 ? "" : "s"}</span></td>`;
          })
          .join("") + `<td>${formatMoney(history.totals.pay)}</td>`
      : `<td>${formatMoney(history.totals.deliveryPay)}</td>`;

    wrap.innerHTML = `
      <table>
        <thead>
          <tr><th>Driver</th><th>Hours</th><th>Base Pay</th>${deliveryHeaders}<th>Tips</th><th>${zoneWise ? "Actual Pay" : "Total Pay"}</th><th>Cash to return (#/&euro;)</th></tr>
        </thead>
        <tbody>${bodyRows}</tbody>
        <tfoot>
          <tr>
            <td>Total (${history.entryCount} ${history.entryCount === 1 ? "day" : "days"})</td>
            <td>${history.totals.hours}h</td>
            <td>${formatMoney(history.totals.basePay)}</td>
            ${footerDeliveryCells}
            <td>${formatMoney(history.totals.tips)}</td>
            <td>${formatMoney(history.totals.finalPay)}</td>
            <td>${history.totals.cashOrderCount} / ${formatMoney(history.totals.cashOrderValue)}</td>
          </tr>
        </tfoot>
      </table>
    `;

    wrap.querySelectorAll(".expand-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.target;
        const expanded = btn.textContent.includes("▾");
        btn.innerHTML = expanded ? "&#9656;" : "&#9662;";
        wrap.querySelectorAll(`tr[data-owner="${id}"]`).forEach((tr) => {
          tr.style.display = expanded ? "none" : "table-row";
        });
      });
    });

    wrap.querySelectorAll(".edit-day-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        window.location.href = `/delivery-entry.html?edit=${btn.dataset.id}&driver=${btn.dataset.driver}`;
      });
    });

    wrap.querySelectorAll(".delete-day-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const ok = await confirmDialog("Are you sure you want to delete this record? This cannot be undone.");
        if (!ok) return;
        try {
          await api(`/api/delivery-entries/${btn.dataset.id}`, { method: "DELETE" });
          await load();
        } catch (err) {
          alert(err.message);
        }
      });
    });
  }

  async function load() {
    try {
      const qs = new URLSearchParams({ mode, anchor });
      const history = await api(`/api/delivery-history?${qs.toString()}`);
      anchor = history.anchor;
      renderTable(history);
      document.getElementById("prev-btn").dataset.anchor = history.prevAnchor;
      document.getElementById("next-btn").dataset.anchor = history.nextAnchor;
    } catch (err) {
      document.getElementById("table-wrap").innerHTML = `
        <p class="empty-state">Couldn't load this period (${err.message}). <button class="btn-secondary btn-small" id="retry-btn">Retry</button></p>
      `;
      document.getElementById("retry-btn").addEventListener("click", load);
    }
  }

  document.querySelectorAll(".tabs button[data-mode]").forEach((btn) => {
    btn.addEventListener("click", () => {
      mode = btn.dataset.mode;
      anchor = todayStr();
      document.querySelectorAll(".tabs button[data-mode]").forEach((b) => b.classList.toggle("active", b === btn));
      load();
    });
  });
  document.getElementById("prev-btn").addEventListener("click", (e) => {
    anchor = e.currentTarget.dataset.anchor;
    load();
  });
  document.getElementById("next-btn").addEventListener("click", (e) => {
    anchor = e.currentTarget.dataset.anchor;
    load();
  });

  (async () => {
    const session = await requireSession();
    if (!session) return;
    renderBranchSidebar(session, "/delivery-history.html");
    await load();
  })();
</script>
</body>
</html>
