<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Tips Tracker</title></head>
<body>
<script>
  (async () => {
    const sessionRes = await fetch("/api/session");
    if (!sessionRes.ok) {
      window.location.href = "/login.html";
      return;
    }
    const session = await sessionRes.json();
    window.location.href = session.role === "owner" ? "/owner-dashboard.html" : "/dashboard.html";
  })();
</script>
</body>
</html>
