<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in - Tips Tracker</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="login-split">
  <div class="login-illustration">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="login-illustration-content">
      <div class="login-brand">Tips<span>Tracker</span></div>
      <div class="login-icon">&#128188;</div>
      <h2>Welcome back. Give your best report today.</h2>
      <p>Log tips and delivery payouts, track pay per employee and driver, and keep every store's numbers straight from one place.</p>
    </div>
  </div>

  <div class="login-form-panel">
    <div class="login-form-card">
      <div class="login-eyebrow"><span class="login-eyebrow-icon">&#128101;</span> Dashboard Login</div>
      <h1>WELCOME BACK</h1>
      <p class="subtitle">Give your best report today!</p>

      <form id="login-form">
        <label for="store-select">Store</label>
        <div class="input-with-icon">
          <span class="field-icon">&#128100;</span>
          <select id="store-select"></select>
        </div>

        <div id="password-block">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <span class="field-icon">&#128274;</span>
            <input type="password" id="password" />
          </div>
        </div>

        <div class="error-msg" id="error"></div>

        <button type="submit" class="btn-primary btn-full" id="submit-btn">Login to My Account</button>
      </form>

      <div id="google-block" style="display:none">
        <div class="or-divider"><span>OR</span></div>
        <button type="button" class="btn-google btn-full" id="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>
      </div>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
  let branches = [];
  let googleAvailable = false;

  function isOwnerSelected() {
    return document.getElementById("store-select").value === "__owner__";
  }

  function populateSelect() {
    const select = document.getElementById("store-select");
    const branchOptions = branches.map((b) => `<option value="${b.id}">${b.name}</option>`).join("");
    select.innerHTML = `${branchOptions}<option value="__owner__">Owner</option>`;
    select.addEventListener("change", updateGoogleVisibility);
  }

  function updateGoogleVisibility() {
    const showGoogle = isOwnerSelected() && googleAvailable;
    document.getElementById("google-block").style.display = showGoogle ? "block" : "none";
  }

  function redirectForRole(role) {
    window.location.href = role === "owner" ? "/owner-dashboard.html" : "/dashboard.html";
  }

  const GOOGLE_ERRORS = {
    google_not_configured: "Google sign-in isn't set up for this account yet.",
    google_email_not_authorized: "That Google account isn't authorized as the owner.",
    google_login_failed: "Google sign-in failed. Please try again.",
  };

  (async () => {
    const sessionRes = await fetch("/api/session");
    if (sessionRes.ok) {
      const session = await sessionRes.json();
      redirectForRole(session.role);
      return;
    }
    const params = new URLSearchParams(window.location.search);
    const errorCode = params.get("error");
    if (errorCode && GOOGLE_ERRORS[errorCode]) {
      document.getElementById("error").textContent = GOOGLE_ERRORS[errorCode];
    }
    const [branchList, googleStatus] = await Promise.all([api("/api/branches"), api("/api/auth/google/available")]);
    branches = branchList;
    googleAvailable = googleStatus.available;
    populateSelect();
    updateGoogleVisibility();
  })();

  document.getElementById("google-btn").addEventListener("click", () => {
    window.location.href = "/auth/google";
  });

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    const password = document.getElementById("password").value;
    try {
      if (isOwnerSelected()) {
        const result = await api("/api/owner-login", { method: "POST", body: JSON.stringify({ password }) });
        redirectForRole(result.role);
      } else {
        const branchId = document.getElementById("store-select").value;
        const result = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({ branchId, password }),
        });
        redirectForRole(result.role);
      }
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
