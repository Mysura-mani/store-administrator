<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in - Tips Tracker</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="login-select-page">
  <div class="login-select-header">
    <div class="brand">Administration<span>Tracker</span></div>
    <button type="button" class="theme-toggle-inline" id="theme-toggle-btn"></button>
  </div>

  <div class="login-select-intro">
    <h1>Choose your account</h1>
    <p class="subtitle">Select where you'd like to log in, then enter your password.</p>
  </div>

  <div class="login-error" id="error"></div>

  <div class="account-carousel">
    <button type="button" class="carousel-arrow" id="carousel-prev" aria-label="Previous account">&larr;</button>
    <div class="account-track" id="account-track"></div>
    <button type="button" class="carousel-arrow" id="carousel-next" aria-label="Next account">&rarr;</button>
  </div>

  <div class="login-legal-footer">
    <a href="/privacy-policy.html">Privacy Policy</a>
    <a href="/terms.html">Terms &amp; Conditions</a>
    <a href="/cookie-policy.html">Cookie Policy</a>
  </div>
</div>

<script src="/common.js"></script>
<script>
  let accounts = [];
  let activeIndex = 0;
  let googleAvailable = false;

  function redirectForRole(role) {
    if (role === "owner") window.location.href = "/owner-dashboard.html";
    else if (role === "driver") window.location.href = "/driver-dashboard.html";
    else window.location.href = "/dashboard.html";
  }

  const GOOGLE_ERRORS = {
    google_not_configured: "Google sign-in isn't set up for this account yet.",
    google_email_not_authorized: "That Google account isn't authorized as the owner.",
    google_login_failed: "Google sign-in failed. Please try again.",
  };

  function cardHtml(account, index) {
    if (index !== activeIndex) {
      return `
        <button type="button" class="account-card" data-index="${index}">
          <div class="account-icon">${account.icon}</div>
          <div class="account-name">${escapeHtml(account.name)}</div>
        </button>
      `;
    }
    const usernameField =
      account.type === "others"
        ? `<label for="acct-username">Username</label>
           <input type="text" id="acct-username" autocomplete="username" />`
        : "";
    const googleBlock =
      account.type === "owner" && googleAvailable
        ? `<div class="or-divider"><span>OR</span></div>
           <button type="button" class="btn-google btn-full" id="google-btn">
             <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
             Continue with Google
           </button>`
        : "";
    return `
      <div class="account-card active" data-index="${index}">
        <div class="account-icon">${account.icon}</div>
        <div class="account-name">${escapeHtml(account.name)}</div>
        <form id="acct-login-form" class="account-login-form">
          ${usernameField}
          <label for="acct-password">Password</label>
          <input type="password" id="acct-password" autocomplete="current-password" />
          <button type="submit" class="btn-primary btn-full" style="margin-top:16px">Log in</button>
        </form>
        ${googleBlock}
      </div>
    `;
  }

  function render() {
    document.getElementById("account-track").innerHTML = accounts.map((a, i) => cardHtml(a, i)).join("");

    document.querySelectorAll(".account-card:not(.active)").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeIndex = Number(btn.dataset.index);
        document.getElementById("error").textContent = "";
        render();
      });
    });

    const form = document.getElementById("acct-login-form");
    if (form) form.addEventListener("submit", handleSubmit);
    const googleBtn = document.getElementById("google-btn");
    if (googleBtn) googleBtn.addEventListener("click", () => { window.location.href = "/auth/google"; });

    const hasMultiple = accounts.length > 1;
    document.getElementById("carousel-prev").style.display = hasMultiple ? "flex" : "none";
    document.getElementById("carousel-next").style.display = hasMultiple ? "flex" : "none";

    // Guide focus straight into the active card's first field, since
    // choosing an account is only step one — typing the password is what
    // actually happens next.
    const usernameInput = document.getElementById("acct-username");
    const passwordInput = document.getElementById("acct-password");
    if (usernameInput) usernameInput.focus();
    else if (passwordInput) passwordInput.focus();
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    const account = accounts[activeIndex];
    const password = document.getElementById("acct-password").value;
    try {
      let result;
      if (account.type === "owner") {
        result = await api("/api/owner-login", { method: "POST", body: JSON.stringify({ password }) });
      } else if (account.type === "others") {
        const username = document.getElementById("acct-username").value;
        result = await api("/api/driver-login", { method: "POST", body: JSON.stringify({ username, password }) });
      } else {
        result = await api("/api/login", { method: "POST", body: JSON.stringify({ branchId: account.id, password }) });
      }
      redirectForRole(result.role);
    } catch (err) {
      errorEl.textContent = err.message;
    }
  }

  document.getElementById("carousel-prev").addEventListener("click", () => {
    activeIndex = (activeIndex - 1 + accounts.length) % accounts.length;
    document.getElementById("error").textContent = "";
    render();
  });
  document.getElementById("carousel-next").addEventListener("click", () => {
    activeIndex = (activeIndex + 1) % accounts.length;
    document.getElementById("error").textContent = "";
    render();
  });

  initThemeToggle(document.getElementById("theme-toggle-btn"));

  (async () => {
    const sessionRes = await fetch("/api/session");
    if (sessionRes.ok) {
      const session = await sessionRes.json();
      redirectForRole(session.role);
      return;
    }
    const params = new URLSearchParams(window.location.search);
    const errorCode = params.get("error");
    if (errorCode && GOOGLE_ERRORS[errorCode]) {
      document.getElementById("error").textContent = GOOGLE_ERRORS[errorCode];
    } else if (params.get("idle") === "1") {
      document.getElementById("error").textContent = "You were logged out after 5 minutes of inactivity.";
    }
    const [branchList, googleStatus] = await Promise.all([api("/api/branches"), api("/api/auth/google/available")]);
    googleAvailable = googleStatus.available;
    // No branches yet — nothing to actually choose between, so go straight
    // to a plain owner login (same bootstrap behavior as before).
    accounts =
      branchList.length === 0
        ? [{ type: "owner", id: "__owner__", name: "Owner", icon: "👑" }]
        : [
            ...branchList.map((b) => ({ type: "branch", id: b.id, name: b.name, icon: "🏬" })),
            { type: "owner", id: "__owner__", name: "Owner", icon: "👑" },
            { type: "others", id: "__others__", name: "Others", icon: "🛵" },
          ];
    activeIndex = 0;
    render();
  })();
</script>
</body>
</html>
