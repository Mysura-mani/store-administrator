<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard - Tips Tracker</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="owner-shell">
  <div class="owner-sidebar">
    <div class="brand">
      Tips<span>Tracker</span>
      <div class="owner-badge" id="role-badge">&mdash;</div>
    </div>
    <div class="owner-nav" id="branch-nav">
      <a href="/dashboard.html" class="nav-link active"><span class="nav-icon">&#128200;</span> Overview</a>
      <a href="/entry.html" class="nav-link"><span class="nav-icon">&#128176;</span> Tip Sheet</a>
      <a href="/delivery-entry.html" class="nav-link"><span class="nav-icon">&#128690;</span> Delivery</a>
      <a href="/history.html" class="nav-link"><span class="nav-icon">&#128197;</span> Tip History</a>
      <a href="/delivery-history.html" class="nav-link"><span class="nav-icon">&#128197;</span> Delivery History</a>
      <div id="admin-nav-links"></div>
      <div id="admin-unlock-slot"></div>
      <div id="back-to-owner-slot"></div>
      <button type="button" id="logout-btn"><span class="nav-icon">&#8618;</span> Log out</button>
    </div>
  </div>

  <div class="owner-main">
    <div class="owner-main-header">
      <h1 id="page-title">Overview</h1>
    </div>
    <p class="subtitle" id="page-subtitle" style="margin-top:-12px; margin-bottom:24px;"></p>

    <div class="stat-card-row" id="stat-card-row">
      <p class="empty-state">Loading&hellip;</p>
    </div>

    <div class="owner-main-header">
      <h1 style="font-size:18px">Quick actions</h1>
    </div>
    <div class="mode-chooser" style="justify-content:flex-start; margin-top:0;">
      <a class="mode-card" href="/entry.html">
        <div class="mode-icon">&#128176;</div>
        <h2>Tip Sheet</h2>
        <p class="subtitle">Log daily cash &amp; credit tips and see weekly/monthly totals per employee.</p>
      </a>
      <a class="mode-card" href="/delivery-entry.html">
        <div class="mode-icon">&#128690;</div>
        <h2>Delivery</h2>
        <p class="subtitle">Log driver hours &amp; deliveries and see weekly/monthly pay per driver.</p>
      </a>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
  (async () => {
    const session = await requireSession();
    if (!session) return;
    if (session.role === "owner") {
      window.location.href = "/owner-dashboard.html";
      return;
    }

    const branchLabel = session.branchName || session.branchId;
    document.getElementById("page-title").textContent = "Overview";
    document.getElementById("page-subtitle").textContent = `Welcome back — here's what's happening at ${branchLabel} today.`;
    document.getElementById("role-badge").textContent = session.role === "admin" ? "Admin" : "Staff";

    if (session.role === "admin") {
      document.getElementById("admin-nav-links").innerHTML = `
        <a href="/employees.html" class="nav-link"><span class="nav-icon">&#128101;</span> Employees</a>
        <a href="/drivers.html" class="nav-link"><span class="nav-icon">&#128663;</span> Drivers</a>
        <a href="/settings.html" class="nav-link"><span class="nav-icon">&#9881;&#65039;</span> Settings</a>
      `;
    } else {
      document.getElementById("admin-unlock-slot").innerHTML = `
        <button type="button" id="admin-btn"><span class="nav-icon">&#128274;</span> Admin</button>
      `;
      document.getElementById("admin-btn").addEventListener("click", openAdminPrompt);
    }

    if (session.viaOwner) {
      document.getElementById("back-to-owner-slot").innerHTML = `
        <button type="button" id="back-to-owner-btn"><span class="nav-icon">&larr;</span> Back to Owner</button>
      `;
      document.getElementById("back-to-owner-btn").addEventListener("click", async () => {
        await api("/api/owner/return", { method: "POST" });
        window.location.href = "/owner-dashboard.html";
      });
    }

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await api("/api/logout", { method: "POST" });
      window.location.href = "/login.html";
    });

    try {
      const [employees, drivers, tipWeek, deliveryWeek] = await Promise.all([
        api("/api/employees"),
        api("/api/drivers"),
        api("/api/history?mode=weekly"),
        api("/api/delivery-history?mode=weekly"),
      ]);

      const statCardRow = document.getElementById("stat-card-row");
      statCardRow.innerHTML = `
        <div class="stat-card">
          <div class="stat-icon" style="background:#dcfce7; color:#15803d;">&#128176;</div>
          <div class="stat-value">${formatMoney(tipWeek.totals.total)}</div>
          <div class="stat-label">Tips this week</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:#fef3c7; color:#b45309;">&#128690;</div>
          <div class="stat-value">${formatMoney(deliveryWeek.totals.finalPay)}</div>
          <div class="stat-label">Delivery pay this week</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:#dbeafe; color:#1d4ed8;">&#128101;</div>
          <div class="stat-value">${employees.length}</div>
          <div class="stat-label">Employees</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:#ede9fe; color:#6d28d9;">&#128663;</div>
          <div class="stat-value">${drivers.length}</div>
          <div class="stat-label">Drivers</div>
        </div>
      `;
    } catch (err) {
      document.getElementById("stat-card-row").innerHTML = `<p class="empty-state">Couldn't load stats (${err.message}).</p>`;
    }
  })();
</script>
</body>
</html>
